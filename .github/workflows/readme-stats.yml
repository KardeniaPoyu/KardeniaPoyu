name: Update README stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-stats.yml

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: stats
          options: username=KardeniaPoyu&show_icons=true&hide_border=true&theme=transparent&title_color=CBA6F7&text_color=CDD6F4&icon_color=F5C2E7&include_all_commits=false&rank_icon=default
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate SVG
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("profile/stats.svg").getroot()
          assert root.tag == "{http://www.w3.org/2000/svg}svg"
          text = " ".join(root.itertext())
          assert "Total Stars" in text and "Total Commits" in text, text
          PY
      - name: Commit stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update README stats card"
          git push

