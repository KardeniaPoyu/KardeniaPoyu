name: Update README stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-stats.yml

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: anuraghazra/github-readme-stats
          ref: 54a7985aeefda00d5eadb55b80c17c7f976c37d2
          path: .readme-stats
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install renderer
        working-directory: .readme-stats
        run: npm ci --omit=dev --ignore-scripts
      - name: Use public star counts compatible with GITHUB_TOKEN
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path(".readme-stats/src/fetchers/stats.js")
          source = path.read_text()
          old = "stargazers {\n        totalCount\n      }"
          assert old in source
          source = source.replace(old, "stargazerCount")
          source = source.replace(".stargazers.totalCount", ".stargazerCount")
          path.write_text(source)
          PY
      - name: Generate stats card
        env:
          PAT_1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import handler from './.readme-stats/api/index.js';
          import { mkdir, writeFile } from 'node:fs/promises';
          const query = Object.fromEntries(new URLSearchParams('username=KardeniaPoyu&show_icons=true&hide_border=true&theme=transparent&title_color=CBA6F7&text_color=CDD6F4&icon_color=F5C2E7&include_all_commits=false&rank_icon=default'));
          let svg = '';
          await handler({ query }, { setHeader() {}, send(value) { svg = value; } });
          if (!svg) throw new Error('Renderer returned an empty card');
          await mkdir('profile', { recursive: true });
          await writeFile('profile/stats.svg', svg);
          JS
      - name: Validate SVG
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("profile/stats.svg").getroot()
          assert root.tag == "{http://www.w3.org/2000/svg}svg"
          text = " ".join(root.itertext())
          assert "Total Stars" in text and "Total Commits" in text, text
          PY
      - name: Commit stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update README stats card"
          git push

